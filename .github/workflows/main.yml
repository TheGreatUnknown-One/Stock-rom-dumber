name: Stock ROM Dumper (DumprX -> Multi Upload)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct ROM URL (used exactly as entered)"
        required: true
        type: string
      target_branch:
        description: "Branch to push files (auto = generate from dump info)"
        required: false
        default: "auto"
        type: string
      device_name:
        description: "Device codename fallback"
        required: false
        default: "unknown"
        type: string
      extract_contents:
        description: "Try extracting filesystem contents from images"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      compress_images:
        description: "Compress .img to .img.xz before push"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_github_branch:
        description: "Upload to this repo smart branch"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      upload_gitlab:
        description: "Upload to GitLab"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_gitea:
        description: "Upload to Gitea/Codeberg"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_sourceforge:
        description: "Upload to SourceForge"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_r2:
        description: "Upload to Cloudflare R2"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  dump-rom:
    runs-on: ubuntu-latest
    concurrency:
      group: dumprx-${{ github.event.inputs.rom_url }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk
        run: |
          set -e
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean -qq || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git git-lfs curl jq file rsync unzip tar zip \
            python3 python3-pip xz-utils p7zip-full sharutils cabextract \
            brotli liblz4-tool gawk detox cpio rename \
            device-tree-compiler e2fsprogs openssh-client

          optional_pkgs=(
            unrar
            android-sdk-libsparse-utils
            e2tools
            erofs-utils
          )

          for pkg in "${optional_pkgs[@]}"; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg" || true
            else
              echo "Optional package not available on this runner: $pkg"
            fi
          done

      - name: Validate URL
        id: input
        run: |
          set -e
          URL='${{ inputs.rom_url }}'
          [ -n "$URL" ] || { echo "ERROR: rom_url is empty"; exit 1; }
          echo "$URL" | grep -qE '^https?://' || { echo "ERROR: rom_url must start with http/https"; exit 1; }
          echo "rom_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using URL exactly: $URL"

      - name: Clone DumprX
        run: |
          set -e
          rm -rf /tmp/DumprX
          git clone --depth=1 https://github.com/DumprX/DumprX.git /tmp/DumprX

      - name: Run DumprX with exact URL
        run: |
          set +e
          cd /tmp/DumprX
          chmod +x dumper.sh setup.sh
          export TERM=xterm

          ./dumper.sh '${{ steps.input.outputs.rom_url }}'
          code=$?
          if [ "$code" -ne 0 ]; then
            if [ -d /tmp/DumprX/out ] && [ -n "$(find /tmp/DumprX/out -type f | head -n1)" ]; then
              echo "DumprX returned non-zero but output exists. Continuing."
            else
              echo "DumprX failed and no output found."
              exit "$code"
            fi
          fi

      - name: Collect output
        run: |
          set -e
          mkdir -p /tmp/final_dump
          [ -d /tmp/DumprX/out ] || { echo "ERROR: /tmp/DumprX/out missing"; exit 1; }
          rsync -a /tmp/DumprX/out/ /tmp/final_dump/

          {
            echo "rom_url=${{ steps.input.outputs.rom_url }}"
            echo "target_branch_input=${{ inputs.target_branch }}"
            echo "device_name_input=${{ inputs.device_name }}"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "dumped_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > /tmp/final_dump/_dump_info.txt

      - name: Resolve target branch
        id: branch
        run: |
          set -e
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//'
          }

          input='${{ inputs.target_branch }}'
          if [ -n "$input" ] && [ "$input" != "auto" ]; then
            out=$(sanitize "$input")
          else
            readme=/tmp/final_dump/README.md
            brand=$(awk -F': ' '/^- Brand:/{print $2; exit}' "$readme" 2>/dev/null || true)
            code=$(awk -F': ' '/^- Codename:/{print $2; exit}' "$readme" 2>/dev/null || true)
            incr=$(awk -F': ' '/^- Incremental:/{print $2; exit}' "$readme" 2>/dev/null || true)
            [ -n "$brand" ] || brand=stock
            [ -n "$code" ] || code='${{ inputs.device_name }}'
            out=$(sanitize "dump-$brand-$code-$incr")
          fi

          [ -n "$out" ] || out="dumps-$(date +%Y%m%d-%H%M%S)"
          [ "$out" != "main" ] || out="dumps-$(date +%Y%m%d-%H%M%S)"

          echo "target_branch=$out" >> "$GITHUB_OUTPUT"
          echo "target_branch_resolved=$out" >> /tmp/final_dump/_dump_info.txt
          echo "Resolved branch: $out"

      - name: Recovery fallback from vendor_boot
        run: |
          set -e
          if ! find /tmp/final_dump -type f -iname 'recovery.img' | grep -q .; then
            vb=$(find /tmp/final_dump -type f -iname 'vendor_boot*.img' | head -n1 || true)
            if [ -n "$vb" ] && [ -f "$vb" ]; then
              cp "$vb" /tmp/final_dump/recovery_from_vendor_boot.img
              echo "recovery_fallback=vendor_boot" >> /tmp/final_dump/_dump_info.txt
              echo "recovery_source_file=$(basename "$vb")" >> /tmp/final_dump/_dump_info.txt
            fi
          fi

      - name: Optional compress images
        if: inputs.compress_images == 'true'
        run: |
          set -e
          find /tmp/final_dump -type f -name '*.img' -print0 | while IFS= read -r -d '' img; do
            xz -T0 -6 "$img"
          done

      - name: Optional extract image contents
        if: inputs.extract_contents == 'true'
        run: |
          set -e
          mkdir -p /tmp/final_dump/extracted
          find /tmp/final_dump -maxdepth 2 -type f -name '*.img' -print0 | while IFS= read -r -d '' img; do
            name=$(basename "$img" .img)
            out=/tmp/final_dump/extracted/$name
            mkdir -p "$out"

            if command -v debugfs >/dev/null 2>&1; then
              if debugfs -R "rdump / $out" "$img" >/dev/null 2>&1; then
                continue
              fi
            fi
          done || true

      - name: Push to target branch (smart)
        if: inputs.upload_github_branch == 'true'
        run: |
          set -e
          BRANCH="${{ steps.branch.outputs.target_branch }}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          find /tmp/final_dump -type f -name '*.apk' -size +100M -delete 2>/dev/null || true
          git lfs install --skip-smudge || true

          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REMOTE_URL" "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH" --depth=1
            git checkout "$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . --quiet 2>/dev/null || true
          fi

          rsync -a --exclude='.git' /tmp/final_dump/ ./
          find . -not -path './.git/*' -type f | sort > file_list.txt
          find . -not -path './.git/*' -type f -exec sha256sum {} \; > checksums.sha256

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "dump: $BRANCH [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            ok=false
            for i in 1 2 3; do
              if git push "$REMOTE_URL" "$BRANCH"; then
                ok=true
                break
              fi
              echo "GitHub push attempt $i failed, retrying..."
              sleep 5
            done
            [ "$ok" = true ] || { echo "ERROR: GitHub upload failed after retries"; exit 1; }
          fi

      - name: GitHub upload disabled
        if: inputs.upload_github_branch != 'true'
        run: echo "GitHub branch upload is disabled. Skipping."

      - name: Resolve GitLab repo name
        id: gitlab_repo
        if: inputs.upload_gitlab == 'true'
        run: |
          set -e
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//'
          }

          readme=/tmp/final_dump/README.md
          brand=$(awk -F': ' '/^- Brand:/{print $2; exit}' "$readme" 2>/dev/null || true)
          code=$(awk -F': ' '/^- Codename:/{print $2; exit}' "$readme" 2>/dev/null || true)
          [ -n "$brand" ] || brand=stock
          [ -n "$code" ] || code='${{ inputs.device_name }}'

          repo_name=$(sanitize "dump-$brand-$code")
          [ -n "$repo_name" ] || repo_name="dump-unknown-$(date +%Y%m%d-%H%M%S)"

          echo "repo_name=$repo_name" >> "$GITHUB_OUTPUT"
          echo "Resolved GitLab repo name: $repo_name"

      - name: Mirror to GitLab
        if: inputs.upload_gitlab == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e

          GL_TOKEN="${GITLAB_TOKEN:-}"
          REPO_NAME="${{ steps.gitlab_repo.outputs.repo_name }}"
          BRANCH="${{ steps.branch.outputs.target_branch }}"

          [ -n "$GL_TOKEN" ] || { echo "ERROR: Missing secret GITLAB_TOKEN"; exit 1; }

          API="https://gitlab.com/api/v4"

          # Resolve the real username tied to this token instead of trusting a
          # secret that could drift out of sync with it — this guarantees the
          # existence check below and the actual project creation always land
          # on the exact same namespace path.
          ME_CODE=$(curl -s -o /tmp/gl_me.json -w "%{http_code}" \
            --header "PRIVATE-TOKEN: $GL_TOKEN" \
            "$API/user")
          if [ "$ME_CODE" != "200" ]; then
            echo "ERROR: Could not resolve GitLab identity for this token (HTTP $ME_CODE)."
            cat /tmp/gl_me.json
            exit 1
          fi
          GL_USER=$(jq -r '.username' /tmp/gl_me.json)
          [ -n "$GL_USER" ] && [ "$GL_USER" != "null" ] || { echo "ERROR: Could not parse GitLab username from token."; exit 1; }
          echo "Resolved GitLab username from token: $GL_USER"

          # Look up the project by path (namespace/repo). 404 = doesn't exist yet.
          PROJECT_PATH_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GL_USER/$REPO_NAME")

          HTTP_CODE=$(curl -s -o /tmp/gl_project.json -w "%{http_code}" \
            --header "PRIVATE-TOKEN: $GL_TOKEN" \
            "$API/projects/$PROJECT_PATH_ENC")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "GitLab repo already exists: $GL_USER/$REPO_NAME"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "GitLab repo not found — creating it: $REPO_NAME"
            CREATE_CODE=$(curl -s -o /tmp/gl_create.json -w "%{http_code}" \
              --header "PRIVATE-TOKEN: $GL_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\": \"$REPO_NAME\", \"path\": \"$REPO_NAME\", \"visibility\": \"public\", \"initialize_with_readme\": false}" \
              "$API/projects")
            if [ "$CREATE_CODE" = "400" ] && grep -q "has already been taken" /tmp/gl_create.json; then
              # Race/drift: it exists after all (e.g. created moments ago by a
              # concurrent run) — treat it as found rather than failing.
              echo "GitLab repo already existed (creation reported 'already taken') — continuing."
            elif [ "$CREATE_CODE" != "201" ]; then
              echo "ERROR: Failed to create GitLab repo (HTTP $CREATE_CODE). Token needs 'api' scope."
              cat /tmp/gl_create.json
              exit 1
            else
              echo "Created GitLab repo: $GL_USER/$REPO_NAME"
              sleep 5
            fi
          else
            echo "ERROR: Unexpected response checking GitLab repo (HTTP $HTTP_CODE)"
            cat /tmp/gl_project.json
            exit 1
          fi

          REPO_URL="https://gitlab.com/${GL_USER}/${REPO_NAME}.git"
          AUTH_REMOTE="${REPO_URL/https:\/\//https:\/\/oauth2:${GL_TOKEN}@}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/gitlab_push
          mkdir -p /tmp/gitlab_push
          SOURCE_COUNT=$(find /tmp/final_dump -type f | wc -l)
          echo "Files in source dump (/tmp/final_dump): $SOURCE_COUNT"
          df -h /tmp

          # cp -al hard-links files instead of duplicating their data blocks,
          # so we don't need double the disk space just to stage the copy.
          # Falls back to rsync only if hard-linking isn't possible (e.g. cross-device).
          if ! cp -al /tmp/final_dump/. /tmp/gitlab_push/ 2>/tmp/cp_err.log; then
            echo "cp -al failed, falling back to rsync (uses more disk):"
            cat /tmp/cp_err.log
            rsync -a /tmp/final_dump/ /tmp/gitlab_push/
          fi
          cd /tmp/gitlab_push

          COPIED_COUNT=$(find . -type f | wc -l)
          echo "Files copied into /tmp/gitlab_push: $COPIED_COUNT"
          if [ "$COPIED_COUNT" -ne "$SOURCE_COUNT" ]; then
            echo "ERROR: Copy is incomplete ($COPIED_COUNT/$SOURCE_COUNT files) — likely ran out of disk space."
            df -h /tmp
            exit 1
          fi

          git init
          git remote add origin "$AUTH_REMOTE"

          # Validate auth and repository path before committing big data.
          # A freshly created GitLab project can take a few seconds for its
          # git backend (Gitaly) to become reachable, so retry with backoff
          # instead of failing on the first attempt.
          LS_OK=false
          for i in 1 2 3 4 5; do
            if git ls-remote origin >/dev/null 2>&1; then
              LS_OK=true
              break
            fi
            echo "git ls-remote attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          if [ "$LS_OK" != "true" ]; then
            echo "ERROR: GitLab auth/repo check failed after creation (403/404 غالبا token scope غلط أو الريبو لسه بيتجهز)."
            echo "Expected repo URL: $REPO_URL"
            echo "Required token scope: api"
            exit 1
          fi

          find . -type f -name '*.apk' -size +100M -delete 2>/dev/null || true

          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 600

          # Resume support: if this branch already has commits on GitLab (from a
          # previous run that got cut off), build on top of that history without
          # touching the working directory (avoids conflicts when re-extracted
          # files differ slightly byte-for-byte, e.g. APK/JAR timestamps).
          git checkout -B "$BRANCH"
          : > /tmp/gitlab_remote_sizes.txt
          if git fetch --depth=1 origin "$BRANCH" 2>/tmp/gitlab_fetch.log; then
            echo "Existing branch found on GitLab — resuming on top of it."
            git reset --soft FETCH_HEAD
            # "<path><TAB><size>" for every blob already committed on the remote.
            git ls-tree -r -l FETCH_HEAD \
              | awk -F'\t' '{n=split($1,a," "); print $2"\t"a[n]}' \
              | sort -t $'\t' -k1,1 > /tmp/gitlab_remote_sizes.txt
          else
            echo "No existing branch on GitLab (or first run) — starting fresh."
            cat /tmp/gitlab_fetch.log
          fi

          # "<path><TAB><size>" for every file in the local dump.
          find . -type f ! -path './.git/*' -printf '%P\t%s\n' \
            | sort -t $'\t' -k1,1 > /tmp/gitlab_local_sizes.txt

          # A path counts as "already done" only if it exists remotely AND the
          # size matches exactly — missing files, or ones present with a
          # mismatched size (e.g. a push cut off mid-object), go back on the
          # upload list instead of being silently skipped.
          join -t $'\t' -j 1 -o 1.1,1.2,2.2 \
            /tmp/gitlab_local_sizes.txt /tmp/gitlab_remote_sizes.txt \
            > /tmp/gitlab_joined.txt
          awk -F'\t' '$2==$3 {print $1}' /tmp/gitlab_joined.txt \
            | sort > /tmp/gitlab_confirmed_done.txt
          cut -f1 /tmp/gitlab_local_sizes.txt | sort > /tmp/gitlab_local_files.txt
          comm -23 /tmp/gitlab_local_files.txt /tmp/gitlab_confirmed_done.txt > /tmp/gitlab_filelist.txt
          TOTAL_FILES=$(wc -l < /tmp/gitlab_filelist.txt)
          ALREADY_ON_REMOTE=$(wc -l < /tmp/gitlab_confirmed_done.txt)
          echo "Already on GitLab: $ALREADY_ON_REMOTE | Remaining to push: $TOTAL_FILES"

          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "Nothing to push — GitLab already has the full dump."
          else
            BATCH_SIZE=150
            BATCH_NUM=0
            TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"

            rm -f /tmp/gitlab_batch_*
            split -l $BATCH_SIZE /tmp/gitlab_filelist.txt /tmp/gitlab_batch_

            PUSHED_COUNT=0

            for batch_file in /tmp/gitlab_batch_*; do
              BATCH_NUM=$((BATCH_NUM + 1))
              echo "=== Batch $BATCH_NUM: $batch_file ==="

              git reset HEAD . 2>/dev/null || true
              git add --pathspec-from-file="$batch_file" 2>/dev/null || true

              git commit -m "dump: $BRANCH batch $BATCH_NUM [$TIMESTAMP]" || true

              ok=false
              for i in 1 2 3; do
                if git push origin "$BRANCH"; then
                  ok=true
                  break
                fi
                echo "GitLab push attempt $i failed for batch $BATCH_NUM — someone else moved the ref, re-syncing..."
                if git fetch origin "$BRANCH" 2>/dev/null; then
                  # Move onto the new tip but keep our batch's changes staged,
                  # then recommit on top of it before trying the push again.
                  git reset --soft FETCH_HEAD
                  git add --pathspec-from-file="$batch_file" 2>/dev/null || true
                  git commit -m "dump: $BRANCH batch $BATCH_NUM [$TIMESTAMP]" || true
                fi
                sleep 5
              done
              if [ "$ok" != "true" ]; then
                echo "ERROR: GitLab upload failed at batch $BATCH_NUM after 3 a
